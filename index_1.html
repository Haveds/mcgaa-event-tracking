<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event RSVPs</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6a7385;
      --line: #e3e6ec; --accent: #2f6fed;
      --yes: #1f8a4c; --yes-bg: #e6f5ec;
      --no: #b3382c;  --no-bg: #fbeae8;
      --maybe: #6a7385; --maybe-bg: #eef0f4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171d; --card: #1d222b; --text: #e8ebf1; --muted: #9aa3b5;
        --line: #2c3340; --accent: #6b9cff;
        --yes: #5fd08d; --yes-bg: #173324;
        --no: #ff8a7d;  --no-bg: #3a1f1c;
        --maybe: #9aa3b5; --maybe-bg: #252b36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }

    .whoami {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    }
    .whoami label { display: block; font-weight: 600; margin-bottom: 6px; }
    select {
      width: 100%; padding: 10px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }

    .event {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px; margin-bottom: 20px;
    }
    .event h2 { margin: 0; font-size: 1.2rem; }
    .meta { color: var(--muted); font-size: .92rem; margin: 2px 0 0; }
    .notes { margin: 10px 0 0; }

    .actions { margin: 14px 0; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600; padding: 10px 18px;
      border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .btn-yes { background: var(--yes-bg); color: var(--yes); border-color: var(--yes); }
    .btn-no  { background: var(--no-bg);  color: var(--no);  border-color: var(--no); }

    .locked {
      margin: 14px 0; padding: 10px 12px; border-radius: 8px;
      background: var(--maybe-bg); font-size: .95rem;
    }
    .hint { margin: 14px 0; color: var(--muted); font-size: .95rem; }

    .counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
    .pill {
      padding: 4px 10px; border-radius: 999px; font-size: .85rem; font-weight: 600;
    }
    .pill.yes   { background: var(--yes-bg);   color: var(--yes); }
    .pill.no    { background: var(--no-bg);    color: var(--no); }
    .pill.maybe { background: var(--maybe-bg); color: var(--maybe); }

    details { margin-top: 8px; }
    summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
    ul.names { margin: 4px 0 8px; padding-left: 20px; columns: 2; column-gap: 24px; }
    @media (max-width: 480px) { ul.names { columns: 1; } }

    #status { margin-top: 12px; color: var(--muted); }
    .error { color: var(--no); }
  </style>
</head>
<body>
  <main>
    <h1>Event RSVPs</h1>
    <p class="sub">Pick your name, then mark each event. Once you submit, only an organizer can change it.</p>

    <section class="whoami">
      <label for="member-select">I am…</label>
      <select id="member-select"><option value="">Loading…</option></select>
    </section>

    <section id="events"></section>
    <p id="status"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
